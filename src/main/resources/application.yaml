spring:
  application:
    name: githive
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/githive?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password@mysql}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /api/**

knife4j:
  enable: true

app:
  security:
    jwt:
      issuer: githive
      secret: ${JWT_SECRET:change-me-to-a-very-long-secret-key-for-githive-auth}
      access-token-expire-minutes: 30
      refresh-token-expire-days: 14
